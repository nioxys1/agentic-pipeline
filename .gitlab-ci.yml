stages:
  - build
  - test
  - security
  - package
  - deploy

variables:
  APP_NAME: "contact-app"
  APP_VERSION: "1.0.0"

build-job:
  stage: build
  image: node:18-alpine
  script: 
    - npm install
    - node -c app.js
    - node -c contacts.js
  artifacts: 
    paths:
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'

test-job: 
  stage: test
  image: node:18-alpine
  script:
    - rm -rf node_modules
    - npm install
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'

security-secrets:
  stage: security
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source=. --verbose --no-git
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^scan-/'
    - if: '$CI_COMMIT_BRANCH == "test"'

sast-semgrep:
  stage: security
  image: returntocorp/semgrep
  script:
    - semgrep ci --config=auto
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^scan-/'
    - if: '$CI_COMMIT_BRANCH == "test"'

package-docker:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $APP_NAME .
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-/'

deploy-staging:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Deploying to staging..."
  environment:
    name: staging
    url: http://staging.contact-app.local
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-/'